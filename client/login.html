
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to the Web POS system">
  <title>Sign in | Web POS</title>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/login.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand" href="/login.html" aria-label="Web POS home">
      <span class="brand-mark">P</span>
      <span>Web POS</span>
    </a>

    <h1>Welcome back</h1>
    <p class="muted">Sign in to access your point of sale.</p>

    <form id="login-form">
      <label for="email">Email address</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <p id="login-error" class="error" role="alert" hidden></p>

      <button id="login-button" type="submit">Sign in</button>
    </form>

    <p class="muted footer-note">Secure access for authorised staff.</p>
  </main>
</body>
</html>
